<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FOR ME NY — Meeting Facilitator</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Noto+Sans+JP:wght@300;400&display=swap');

  :root {
    --bg:         #faf9f7;
    --surface:    #ffffff;
    --surface2:   #f5f3f0;
    --border:     #e8e2d9;
    --border2:    #d4ccc0;
    --apricot:    #d4845a;
    --apricot-lt: #e8a882;
    --apricot-bg: #fdf0e8;
    --navy:       #2b3a52;
    --navy-lt:    #4a5e7a;
    --text:       #3d3530;
    --text-mid:   #7a6f66;
    --text-dim:   #b0a89e;
    --green:      #5a826a;
    --red:        #c05040;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 13px;
    font-weight: 300;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* ── Header ── */
  header {
    width: 100%;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 36px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .logo-wrap { display: flex; align-items: center; gap: 12px; }
  .logo-circle {
    width: 38px; height: 38px;
    border-radius: 50%;
    border: 1.5px solid var(--apricot);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Cormorant Garamond', serif;
    font-size: 11px; font-weight: 400;
    color: var(--apricot);
    letter-spacing: 0.04em;
    flex-shrink: 0;
  }
  .logo-text {
    font-family: 'Cormorant Garamond', serif;
    font-size: 19px;
    font-weight: 400;
    color: var(--navy);
    letter-spacing: 0.14em;
  }
  .logo-text span { color: var(--apricot); }
  .tagline {
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 0.1em;
    font-weight: 300;
  }

  /* ── Screens ── */
  .screen {
    display: none;
    flex-direction: column;
    align-items: center;
    width: 100%;
    max-width: 700px;
    padding: 44px 24px 60px;
    gap: 28px;
  }
  .screen.active { display: flex; }

  .screen-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 26px;
    font-weight: 300;
    color: var(--navy);
    letter-spacing: 0.1em;
    text-align: center;
  }
  .screen-sub {
    font-size: 11px;
    color: var(--text-mid);
    letter-spacing: 0.06em;
    text-align: center;
    margin-top: -16px;
    line-height: 1.8;
  }

  /* ── Setup card ── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 32px;
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  .field-label {
    font-size: 9px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--apricot);
    margin-bottom: 7px;
    font-weight: 400;
  }

  .key-row { display: flex; gap: 8px; }
  .key-input {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 9px 12px;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 11px;
    font-weight: 300;
    outline: none;
    transition: border-color 0.15s;
  }
  .key-input:focus { border-color: var(--apricot-lt); }
  .save-btn {
    background: var(--apricot);
    color: #fff;
    border: none;
    padding: 9px 18px;
    cursor: pointer;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 10px;
    font-weight: 400;
    letter-spacing: 0.06em;
    white-space: nowrap;
    transition: background 0.15s;
  }
  .save-btn:hover { background: var(--apricot-lt); }
  .key-status { font-size: 10px; color: var(--text-dim); margin-top: 5px; }
  .key-status.ok { color: var(--green); }

  .divider { border: none; border-top: 1px solid var(--border); }

  /* Participant inputs */
  .participant-inputs { display: flex; flex-direction: column; gap: 8px; }
  .p-input-row { display: flex; gap: 8px; align-items: center; }
  .p-input-row input {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 9px 12px;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 13px;
    font-weight: 300;
    outline: none;
    transition: border-color 0.15s;
  }
  .p-input-row input:focus { border-color: var(--apricot-lt); }
  .p-input-row input::placeholder { color: var(--text-dim); }
  .remove-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    width: 30px; height: 30px;
    cursor: pointer;
    font-size: 14px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: all 0.15s;
  }
  .remove-btn:hover { border-color: var(--red); color: var(--red); }

  .add-btn {
    background: transparent;
    border: 1px dashed var(--border2);
    color: var(--text-dim);
    padding: 9px;
    cursor: pointer;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 11px;
    width: 100%;
    text-align: center;
    transition: all 0.15s;
    margin-top: 4px;
  }
  .add-btn:hover { border-color: var(--apricot-lt); color: var(--apricot); }

  .start-btn {
    background: transparent;
    border: 1.5px solid var(--apricot);
    color: var(--apricot);
    padding: 14px 48px;
    cursor: pointer;
    font-family: 'Cormorant Garamond', serif;
    font-size: 15px;
    font-weight: 400;
    letter-spacing: 0.16em;
    transition: all 0.2s;
    align-self: center;
  }
  .start-btn:hover { background: var(--apricot); color: #fff; }
  .start-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .start-btn:disabled:hover { background: transparent; color: var(--apricot); }

  /* ── Facilitator screen ── */
  .phase-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
  }
  .phase-tag {
    font-size: 9px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--apricot);
    font-weight: 400;
  }
  .speaking-ind {
    display: none;
    align-items: center;
    gap: 8px;
    font-size: 10px;
    color: var(--apricot);
    letter-spacing: 0.06em;
  }
  .speaking-ind.on { display: flex; }
  .wave { display: flex; gap: 3px; align-items: center; height: 14px; }
  .wbar {
    width: 3px; background: var(--apricot); border-radius: 2px;
    animation: waveAnim 0.8s ease-in-out infinite;
  }
  .wbar:nth-child(2) { animation-delay: 0.15s; }
  .wbar:nth-child(3) { animation-delay: 0.3s; }
  .wbar:nth-child(4) { animation-delay: 0.45s; }
  @keyframes waveAnim { 0%,100% { height: 3px; } 50% { height: 13px; } }

  /* Progress */
  .progress-track { width: 100%; height: 2px; background: var(--border); position: relative; }
  .progress-fill { position: absolute; top: 0; left: 0; height: 100%; background: var(--apricot); transition: width 0.5s ease; }

  /* Script display */
  .script-box {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-top: 3px solid var(--apricot);
    padding: 32px 36px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 19px;
    font-weight: 300;
    color: var(--text-mid);
    line-height: 2;
    min-height: 160px;
    transition: color 0.3s;
  }
  .script-box.speaking { color: var(--text); }

  /* Controls */
  .controls {
    display: flex;
    gap: 12px;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
  }
  .ctrl-btn {
    background: transparent;
    border: 1px solid var(--border2);
    color: var(--text-mid);
    padding: 10px 24px;
    cursor: pointer;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 11px;
    font-weight: 300;
    letter-spacing: 0.06em;
    transition: all 0.15s;
  }
  .ctrl-btn:hover { border-color: var(--apricot-lt); color: var(--apricot); }
  .ctrl-btn.primary { border-color: var(--apricot); color: var(--apricot); font-weight: 400; }
  .ctrl-btn.primary:hover { background: var(--apricot); color: #fff; }
  .ctrl-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  /* ── One Word Story ── */
  .story-card {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-top: 3px solid var(--apricot);
    padding: 28px 32px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .participant-list { display: flex; flex-direction: column; gap: 5px; }
  .p-row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px 16px;
    border: 1px solid var(--border);
    background: var(--surface2);
    transition: all 0.2s;
  }
  .p-row.current {
    border-color: var(--apricot);
    background: var(--apricot-bg);
  }
  .p-num {
    font-size: 10px;
    color: var(--text-dim);
    width: 18px;
    text-align: right;
    flex-shrink: 0;
    font-family: 'Cormorant Garamond', serif;
  }
  .p-name {
    flex: 1;
    font-family: 'Cormorant Garamond', serif;
    font-size: 18px;
    font-weight: 300;
    color: var(--text-mid);
    letter-spacing: 0.04em;
  }
  .p-row.current .p-name { color: var(--apricot); }
  .p-badge {
    font-size: 9px;
    letter-spacing: 0.12em;
    color: var(--apricot);
    opacity: 0;
    font-weight: 400;
  }
  .p-row.current .p-badge { opacity: 1; }

  .story-label {
    font-size: 9px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 8px;
    font-weight: 400;
  }
  .story-words {
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px;
    font-weight: 300;
    color: var(--text);
    line-height: 1.8;
    min-height: 50px;
    letter-spacing: 0.02em;
  }
  .story-words .new-word {
    color: var(--apricot);
    animation: fadeWord 0.4s ease;
  }
  @keyframes fadeWord { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: translateY(0); } }

  .word-input-row { display: flex; gap: 8px; }
  .word-input {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 14px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 17px;
    font-weight: 300;
    outline: none;
    transition: border-color 0.15s;
  }
  .word-input:focus { border-color: var(--apricot-lt); }
  .word-input::placeholder { color: var(--text-dim); font-family: 'Noto Sans JP', sans-serif; font-size: 11px; }
  .add-word-btn {
    background: var(--apricot);
    color: #fff;
    border: none;
    padding: 10px 22px;
    cursor: pointer;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 11px;
    font-weight: 400;
    letter-spacing: 0.06em;
    transition: background 0.15s;
  }
  .add-word-btn:hover { background: var(--apricot-lt); }

  .round-ind { font-size: 10px; color: var(--text-dim); text-align: center; letter-spacing: 0.08em; }

  /* ── End screen ── */
  .end-message {
    font-family: 'Cormorant Garamond', serif;
    font-size: 20px;
    font-weight: 300;
    color: var(--text);
    line-height: 2;
    text-align: center;
    max-width: 520px;
  }
  .story-result {
    background: var(--surface);
    border: 1px solid var(--border);
    border-top: 3px solid var(--apricot);
    padding: 28px 32px;
    width: 100%;
  }
  .story-result-label { font-size: 9px; letter-spacing: 0.18em; color: var(--apricot); margin-bottom: 12px; font-weight: 400; }
  .story-result-text {
    font-family: 'Cormorant Garamond', serif;
    font-size: 19px;
    font-weight: 300;
    color: var(--text-mid);
    line-height: 1.9;
  }

  /* ── Record button ── */
  .rec-btn {
    width: 80px; height: 80px; border-radius: 50%;
    border: 2px solid var(--apricot);
    background: transparent;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
    -webkit-user-select: none; user-select: none;
    touch-action: none;
  }
  .rec-btn:hover { border-color: var(--apricot-lt); }
  .rec-btn.recording { border-color: var(--red); animation: recPulse 1.2s ease-in-out infinite; }
  .rec-dot {
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--apricot); transition: all 0.15s;
  }
  .rec-btn.recording .rec-dot { background: var(--red); border-radius: 3px; }
  @keyframes recPulse { 0%,100% { box-shadow: 0 0 0 0 rgba(192,80,64,0.3); } 50% { box-shadow: 0 0 0 14px rgba(192,80,64,0); } }
  .rec-label { font-size: 10px; color: var(--text-dim); letter-spacing: 0.1em; }

  /* ── Story replay on end screen ── */
  .replay-story-area {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-top: 3px solid var(--apricot);
    padding: 24px 32px;
    display: flex; flex-direction: column; gap: 14px; align-items: center;
  }
  .replay-story-label { font-size: 9px; letter-spacing: 0.18em; color: var(--apricot); font-weight: 400; align-self: flex-start; }
  .replay-story-words { font-family: 'Cormorant Garamond', serif; font-size: 19px; font-weight: 300; color: var(--text-mid); line-height: 1.9; align-self: flex-start; }

  /* ── Loading dots ── */
  .ldots { display: inline-flex; gap: 5px; vertical-align: middle; }
  .ldot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--apricot-lt);
    animation: ldBounce 1s ease-in-out infinite;
  }
  .ldot:nth-child(2) { animation-delay: 0.15s; }
  .ldot:nth-child(3) { animation-delay: 0.3s; }
  @keyframes ldBounce { 0%,80%,100% { transform: translateY(0); opacity: 0.4; } 40% { transform: translateY(-6px); opacity: 1; } }

  ::-webkit-scrollbar { width: 3px; }
  ::-webkit-scrollbar-thumb { background: var(--border2); }
</style>
</head>
<body>

<header>
  <div class="logo-wrap">
    <div class="logo-circle">F</div>
    <div class="logo-text">FOR ME <span>NY</span></div>
  </div>
  <div class="tagline">Meeting Facilitator</div>
</header>

<!-- ── SCREEN 1: SETUP ── -->
<div class="screen active" id="screenSetup">
  <div class="screen-title">セッションの準備</div>
  <div class="screen-sub">APIキーを設定して、参加者の名前を入力してください</div>

  <div class="card">
    <div>
      <div class="field-label">Anthropic API Key</div>
      <div class="key-row">
        <input class="key-input" id="anthropicKey" type="password" placeholder="sk-ant-..." />
        <button class="save-btn" onclick="saveAnthropicKey()">保存</button>
      </div>
      <div class="key-status" id="anthropicStatus">未設定</div>
    </div>

    <div>
      <div class="field-label">OpenAI API Key（音声認識）</div>
      <div class="key-row">
        <input class="key-input" id="openaiKey" type="password" placeholder="sk-..." />
        <button class="save-btn" onclick="saveOpenAIKey()">保存</button>
      </div>
      <div class="key-status" id="openaiStatus">未設定</div>
    </div>

    <div>
      <div class="field-label">Google Cloud API Key（音声合成）</div>
      <div class="key-row">
        <input class="key-input" id="googleKey" type="password" placeholder="AIza..." />
        <button class="save-btn" onclick="saveGoogleKey()">保存</button>
      </div>
      <div class="key-status" id="googleStatus">未設定</div>
    </div>

    <hr class="divider" />

    <div>
      <div class="field-label">参加者の名前</div>
      <div class="participant-inputs" id="participantInputs"></div>
      <button class="add-btn" onclick="addParticipantField()">＋ 参加者を追加</button>
    </div>
  </div>

  <button class="start-btn" id="startBtn" onclick="startSession()" disabled>
    セッションを開始する
  </button>
</div>

<!-- ── SCREEN 2: FACILITATOR ── -->
<div class="screen" id="screenFacilitator">

  <div class="phase-row">
    <div class="phase-tag" id="phaseTag">— Intro —</div>
    <div class="speaking-ind" id="speakingInd">
      <div class="wave">
        <div class="wbar"></div><div class="wbar"></div>
        <div class="wbar"></div><div class="wbar"></div>
      </div>
      話しています
    </div>
  </div>

  <div class="progress-track">
    <div class="progress-fill" id="progressFill" style="width:0%"></div>
  </div>

  <div class="script-box" id="scriptBox">
    <div class="ldots"><div class="ldot"></div><div class="ldot"></div><div class="ldot"></div></div>
  </div>

  <!-- One Word Story — hidden until that phase -->
  <div class="story-card" id="storyCard" style="display:none">
    <div class="field-label">One Word Story</div>
    <div class="participant-list" id="participantList"></div>

    <!-- announce + record area -->
    <div id="storyAnnounce" style="min-height:36px; font-family:'Cormorant Garamond',serif; font-size:18px; font-weight:300; color:var(--apricot); text-align:center; letter-spacing:0.04em;"></div>

    <div style="display:flex; flex-direction:column; align-items:center; gap:12px;">
      <button class="rec-btn" id="recBtn" onmousedown="startRecording()" onmouseup="stopRecording()" ontouchstart="startRecording()" ontouchend="stopRecording()">
        <div class="rec-dot" id="recDot"></div>
      </button>
      <div class="rec-label" id="recLabel">押している間、録音</div>
      <div id="recStatus" style="font-size:10px; color:var(--text-dim); letter-spacing:0.08em; min-height:16px;"></div>
    </div>

    <div>
      <div class="story-label">みんなで作っている物語</div>
      <div class="story-words" id="storyWords">（まだ始まっていません）</div>
    </div>
    <div class="round-ind" id="roundInd"></div>
  </div>

  <!-- end story + replay story buttons (shown during story phase) -->
  <div id="storyControls" style="display:none; gap:12px; flex-wrap:wrap; justify-content:center;">
    <button class="ctrl-btn" id="replayStoryBtn" onclick="replayStory()" style="display:none;">物語を再生 ▶</button>
    <button class="ctrl-btn primary" onclick="endStoryPhase()">ストーリーを終わる ›</button>
  </div>

  <div class="controls" id="mainControls">
    <button class="ctrl-btn" id="replayBtn" onclick="replayCurrentPhase()">もう一度再生</button>
    <button class="ctrl-btn primary" id="nextBtn" onclick="nextPhase()">次へ ›</button>
  </div>

</div>

<!-- ── SCREEN 3: END ── -->
<div class="screen" id="screenEnd">
  <div class="screen-title">お疲れ様でした</div>
  <div class="end-message" id="endMessage">
    <div class="ldots"><div class="ldot"></div><div class="ldot"></div><div class="ldot"></div></div>
  </div>
  <div class="replay-story-area" id="replayStoryArea" style="display:none">
    <div class="replay-story-label">みんなで作った物語</div>
    <div class="replay-story-words" id="replayStoryWords"></div>
    <button class="ctrl-btn primary" id="replayAllBtn" onclick="replayAllRecordings()">▶ 声をつなげて再生</button>
  </div>
  <button class="ctrl-btn" onclick="resetSession()" style="margin-top:8px">最初に戻る</button>
</div>

<script>
// ── State ─────────────────────────────────────────────────────
let anthropicKey = localStorage.getItem('formeny_anthropic_key') || '';
let googleKey    = localStorage.getItem('formeny_google_key')    || '';
let openaiKey    = localStorage.getItem('formeny_openai_key')    || '';
let participants = [];
let currentPhaseIdx = 0;
let currentAudio = null;
let storyWords = [];       // [{word, person, audioBlob}]
let storyAudioBlobs = [];  // ordered Blobs for final replay
let currentTurnIdx = 0;
let roundCount = 0;
let currentScript = '';
let mediaRecorder = null;
let recChunks = [];
let isRecording = false;

const PHASES = ['intro', 'bodyscan', 'impro_intro', 'impro_game', 'outro'];
const PHASE_TAGS = {
  intro:       '— Intro —',
  bodyscan:    '— Part 1：ボディスキャン —',
  impro_intro: '— Part 2：One Word Story 説明 —',
  impro_game:  '— One Word Story —',
  outro:       '— クロージング —',
};
const PROGRESS_MAP = { intro: 10, bodyscan: 35, impro_intro: 60, impro_game: 80, outro: 100 };

// ── Init ──────────────────────────────────────────────────────
(function init() {
  if (anthropicKey) { setKeyOk('anthropicStatus'); document.getElementById('anthropicKey').value = '••••••••'; }
  if (googleKey)    { setKeyOk('googleStatus');    document.getElementById('googleKey').value    = '••••••••'; }
  if (openaiKey)    { setKeyOk('openaiStatus');    document.getElementById('openaiKey').value    = '••••••••'; }
  addParticipantField();
  addParticipantField();
  addParticipantField();
  checkStartable();
})();

// ── Key helpers ───────────────────────────────────────────────
function saveAnthropicKey() {
  const v = document.getElementById('anthropicKey').value.trim();
  if (!v || v === '••••••••') return;
  anthropicKey = v;

// ── Participant fields ────────────────────────────────────────
function addParticipantField() {
  const container = document.getElementById('participantInputs');
  const idx = container.children.length;
  const row = document.createElement('div');
  row.className = 'p-input-row';
  row.innerHTML =
    '<input type="text" placeholder="参加者 ' + (idx + 1) + '" oninput="checkStartable()" />' +
    '<button class="remove-btn" onclick="removeParticipantField(this)">×</button>';
  container.appendChild(row);
  checkStartable();
}
function removeParticipantField(btn) {
  btn.parentElement.remove();
  checkStartable();
}
function getParticipantNames() {
  return Array.from(document.querySelectorAll('#participantInputs input'))
    .map(function(i) { return i.value.trim(); })
    .filter(Boolean);
}
function checkStartable() {
  const names = getParticipantNames();
  const ok = anthropicKey && googleKey && openaiKey && names.length >= 2;
  document.getElementById('startBtn').disabled = !ok;
}

// ── Session ───────────────────────────────────────────────────
async function startSession() {
  participants = getParticipantNames();
  currentPhaseIdx = 0;
  storyWords = [];
  storyAudioBlobs = [];
  currentTurnIdx = 0;
  roundCount = 0;
  currentScript = '';
  document.getElementById('screenSetup').classList.remove('active');
  document.getElementById('screenFacilitator').classList.add('active');
  document.getElementById('nextBtn').textContent = '次へ ›';
  await runPhase(PHASES[0]);
}

// ── Phase runner ──────────────────────────────────────────────
async function runPhase(phase) {
  // Update phase UI
  document.getElementById('phaseTag').textContent = PHASE_TAGS[phase] || '';
  document.getElementById('progressFill').style.width = (PROGRESS_MAP[phase] || 0) + '%';
  document.getElementById('storyCard').style.display = 'none';
  document.getElementById('scriptBox').style.display = 'block';
  document.getElementById('mainControls').style.display = 'flex';
  document.getElementById('replayBtn').disabled = false;
  document.getElementById('nextBtn').disabled = false;

  if (phase === 'impro_game') {
    document.getElementById('scriptBox').style.display = 'none';
    document.getElementById('storyCard').style.display = 'flex';
    document.getElementById('storyControls').style.display = 'flex';
    document.getElementById('mainControls').style.display = 'none';
    buildParticipantList();
    updateStoryDisplay();
    await announceNextTurn();
    return;
  }

  document.getElementById('scriptBox').className = 'script-box';
  document.getElementById('scriptBox').innerHTML =
    '<div class="ldots"><div class="ldot"></div><div class="ldot"></div><div class="ldot"></div></div>';
  document.getElementById('replayBtn').disabled = true;
  document.getElementById('nextBtn').disabled = true;

  const script = await generateScript(phase);
  currentScript = script;
  document.getElementById('scriptBox').className = 'script-box speaking';
  document.getElementById('scriptBox').textContent = script.replace(/\[間\s*[\d.]+[秒s]?\]/g, '').replace(/\s{2,}/g, ' ').trim();
  document.getElementById('replayBtn').disabled = false;
  document.getElementById('nextBtn').disabled = false;
  await speak(script);

  // outro → automatically move to end screen after TTS finishes
  if (phase === 'outro') {
    await endSession();
  }
}

// ── Navigation ────────────────────────────────────────────────
async function nextPhase() {
  stopAudio();
  currentPhaseIdx++;
  if (currentPhaseIdx >= PHASES.length) {
    endSession();
    return;
  }
  await runPhase(PHASES[currentPhaseIdx]);
}

async function replayCurrentPhase() {
  const phase = PHASES[currentPhaseIdx];
  if (phase === 'impro_game') return;
  stopAudio();
  if (currentScript) await speak(currentScript);
}

// ── One Word Story ────────────────────────────────────────────
// ── One Word Story ────────────────────────────────────────────

function buildParticipantList() {
  const list = document.getElementById('participantList');
  list.innerHTML = '';
  participants.forEach(function(name, i) {
    const row = document.createElement('div');
    row.className = 'p-row' + (i === currentTurnIdx ? ' current' : '');
    row.id = 'prow-' + i;
    row.innerHTML =
      '<span class="p-num">' + (i + 1) + '</span>' +
      '<span class="p-name">' + esc(name) + '</span>' +
      '<span class="p-badge">▶ 今ここ</span>';
    list.appendChild(row);
  });
}

function updateHighlight() {
  participants.forEach(function(_, i) {
    const row = document.getElementById('prow-' + i);
    if (!row) return;
    row.className = 'p-row' + (i === currentTurnIdx ? ' current' : '');
  });
}

function updateStoryDisplay() {
  const el = document.getElementById('storyWords');
  if (storyWords.length === 0) {
    el.textContent = '（まだ始まっていません）';
    return;
  }
  el.innerHTML = storyWords.map(function(w, i) {
    const cls = i === storyWords.length - 1 ? ' class="new-word"' : '';
    return '<span' + cls + '>' + esc(w.word) + '</span>';
  }).join(' ');
}

// Announce whose turn it is via TTS
async function announceNextTurn() {
  const name = participants[currentTurnIdx];
  document.getElementById('storyAnnounce').textContent = name + 'さん、どうぞ';
  document.getElementById('recLabel').textContent = '押している間、録音';
  document.getElementById('recStatus').textContent = '';
  updateHighlight();
  await speak(name + 'さん、どうぞ');
  // Enable record button after TTS finishes
  document.getElementById('recBtn').disabled = false;
}

// ── MediaRecorder recording ────────────────────────────────────
async function startRecording() {
  if (isRecording) return;
  if (currentAudio && !currentAudio.paused) return; // wait for TTS
  isRecording = true;
  recChunks = [];
  document.getElementById('recBtn').classList.add('recording');
  document.getElementById('recLabel').textContent = '録音中…';
  document.getElementById('recStatus').textContent = '';
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const mimeType = MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : 'audio/ogg';
    mediaRecorder = new MediaRecorder(stream, { mimeType: mimeType });
    mediaRecorder.ondataavailable = function(e) { if (e.data.size > 0) recChunks.push(e.data); };
    mediaRecorder.start();
  } catch(e) {
    console.warn('Mic error:', e);
    isRecording = false;
    document.getElementById('recBtn').classList.remove('recording');
    document.getElementById('recStatus').textContent = 'マイクへのアクセスを許可してください';
  }
}

async function stopRecording() {
  if (!isRecording || !mediaRecorder) return;
  isRecording = false;
  document.getElementById('recBtn').classList.remove('recording');
  document.getElementById('recBtn').disabled = true;
  document.getElementById('recLabel').textContent = '認識中…';

  // Stop all mic tracks
  mediaRecorder.stream.getTracks().forEach(function(t) { t.stop(); });

  await new Promise(function(resolve) {
    mediaRecorder.onstop = resolve;
    mediaRecorder.stop();
  });

  const mimeType = recChunks.length > 0 ? mediaRecorder.mimeType : 'audio/webm';
  const audioBlob = new Blob(recChunks, { type: mimeType });
  recChunks = [];

  // Send to Whisper
  const word = await transcribeWithWhisper(audioBlob, mimeType);
  if (!word) {
    document.getElementById('recStatus').textContent = '聞き取れませんでした。もう一度どうぞ';
    document.getElementById('recBtn').disabled = false;
    document.getElementById('recLabel').textContent = '押している間、録音';
    return;
  }

  // Save word + blob
  storyWords.push({ word: word, person: participants[currentTurnIdx], blob: audioBlob });
  storyAudioBlobs.push(audioBlob);

  // Advance turn
  currentTurnIdx = (currentTurnIdx + 1) % participants.length;
  if (currentTurnIdx === 0) roundCount++;
  document.getElementById('roundInd').textContent = roundCount > 0 ? 'ラウンド ' + roundCount + ' 周目' : '';

  updateStoryDisplay();

  // Show replay button once we have words
  if (storyAudioBlobs.length > 0) {
    document.getElementById('replayStoryBtn').style.display = 'inline-block';
  }

  // Announce next
  await announceNextTurn();
}

// Whisper transcription
async function transcribeWithWhisper(blob, mimeType) {
  const ext = mimeType.includes('ogg') ? 'ogg' : 'webm';
  const formData = new FormData();
  formData.append('file', blob, 'audio.' + ext);
  formData.append('model', 'whisper-1');
  formData.append('language', 'ja');
  formData.append('prompt', 'これはOne Word Storyというゲームです。参加者が一語ずつ言っています。');
  try {
    const resp = await fetch('https://api.openai.com/v1/audio/transcriptions', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + openaiKey },
      body: formData,
    });
    const data = await resp.json();
    if (data.error) throw new Error(data.error.message);
    // Extract first word only
    const text = (data.text || '').trim();
    return text.split(/[\s　。、！？,.!?]+/)[0] || text;
  } catch(e) {
    console.warn('Whisper error:', e);
    return null;
  }
}

// End story phase → move to outro
async function endStoryPhase() {
  currentPhaseIdx = PHASES.indexOf('outro');
  document.getElementById('storyControls').style.display = 'none';
  document.getElementById('storyCard').style.display = 'none';
  document.getElementById('scriptBox').style.display = 'block';
  document.getElementById('mainControls').style.display = 'flex';
  // runPhase('outro') will speak the script, then auto-call endSession()
  await runPhase('outro');
}

// Play all recorded blobs in sequence
async function replayStory() {
  if (storyAudioBlobs.length === 0) return;
  const btn = document.getElementById('replayStoryBtn');
  btn.disabled = true;
  for (let i = 0; i < storyAudioBlobs.length; i++) {
    await playBlob(storyAudioBlobs[i]);
  }
  btn.disabled = false;
}

async function replayAllRecordings() {
  if (storyAudioBlobs.length === 0) return;
  const btn = document.getElementById('replayAllBtn');
  btn.disabled = true;
  btn.textContent = '再生中…';
  for (let i = 0; i < storyAudioBlobs.length; i++) {
    await playBlob(storyAudioBlobs[i]);
  }
  btn.disabled = false;
  btn.textContent = '▶ 声をつなげて再生';
}

function playBlob(blob) {
  return new Promise(function(resolve) {
    const url = URL.createObjectURL(blob);
    const audio = new Audio(url);
    currentAudio = audio;
    function cleanup() { URL.revokeObjectURL(url); currentAudio = null; resolve(); }
    audio.onended = cleanup;
    audio.onerror = cleanup;
    audio.play().catch(cleanup);
  });
}

      '話し言葉のみ、約1分、毎回少し違う表現で。余分な記号・箇条書き不要。',

      '話し言葉のみ。[間 Ns] 以外の記号・箇条書き不要。毎回少し違う表現で。',

// ── TTS (OpenAI) ──────────────────────────────────────────────
// Splits text on [間 Ns] markers and inserts real silence between segments.
// e.g. "息を吸って。[間 4秒] 吐き出します。" → speak "息を吸って。", wait 4s, speak "吐き出します。"

let _stopRequested = false;

async function speak(text) {
  stopAudio();
  _stopRequested = false;
  const ind = document.getElementById('speakingInd');
  ind.classList.add('on');
  document.getElementById('scriptBox').classList.add('speaking');

  // Split on [間 Ns] or [間 N秒] markers
  const parts = splitWithPauses(text);

  for (let i = 0; i < parts.length; i++) {
    if (_stopRequested) break;
    const part = parts[i];
    if (part.type === 'pause') {
      await sleep(part.ms);
    } else if (part.text.trim()) {
      await speakSegment(part.text.trim());
    }
  }

  ind.classList.remove('on');
}

function splitWithPauses(text) {
  // Match [間 Ns] or [間 N秒] — N can be integer or decimal
  const re = /\[間\s*([\d.]+)[秒s]?\]/g;
  const parts = [];
  let last = 0, m;
  while ((m = re.exec(text)) !== null) {
    if (m.index > last) parts.push({ type: 'text', text: text.slice(last, m.index) });
    parts.push({ type: 'pause', ms: Math.round(parseFloat(m[1]) * 1000) });
    last = m.index + m[0].length;
  }
  if (last < text.length) parts.push({ type: 'text', text: text.slice(last) });
  return parts;
}

function speakSegment(text) {
  return new Promise(function(resolve) {
    if (_stopRequested) { resolve(); return; }
    // Google Cloud TTS REST API — Chirp3 HD, ja-JP-Chirp3-HD-Charon (male, natural)
    fetch('https://texttospeech.googleapis.com/v1/text:synthesize?key=' + googleKey, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        input: { text: text },
        voice: { languageCode: 'ja-JP', name: 'ja-JP-Chirp3-HD-Charon' },
        audioConfig: { audioEncoding: 'MP3', speakingRate: 0.90 },
      }),
    })
    .then(function(resp) {
      if (!resp.ok) throw new Error('Google TTS ' + resp.status);
      return resp.json();
    })
    .then(function(data) {
      if (!data.audioContent) throw new Error('No audioContent');
      // Decode base64 MP3
      const binary = atob(data.audioContent);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      const blob = new Blob([bytes], { type: 'audio/mpeg' });
      const url = URL.createObjectURL(blob);
      const audio = new Audio(url);
      currentAudio = audio;
      function cleanup() {
        URL.revokeObjectURL(url);
        currentAudio = null;
        resolve();
      }
      audio.onended = cleanup;
      audio.onerror = cleanup;
      audio.play().catch(cleanup);
    })
    .catch(function(e) {
      console.warn('Google TTS error:', e);
      resolve();
    });
  });
}

function sleep(ms) {
  return new Promise(function(resolve) {
    setTimeout(resolve, ms);
  });
}

function stopAudio() {
  _stopRequested = true;
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  document.getElementById('speakingInd').classList.remove('on');
}

// ── End session ───────────────────────────────────────────────
function endSession() {
  stopAudio();
  document.getElementById('screenFacilitator').classList.remove('active');
  document.getElementById('screenEnd').classList.add('active');

  // Show story words + replay button
  if (storyWords.length > 0) {
    const storyText = storyWords.map(function(w) { return w.word; }).join(' ');
    document.getElementById('replayStoryArea').style.display = 'flex';
    document.getElementById('replayStoryWords').textContent = storyText;
    if (storyAudioBlobs.length === 0) {
      document.getElementById('replayAllBtn').style.display = 'none';
    }
  }
  // endMessage: set from currentScript (outro already played in runPhase)
  if (currentScript) {
    document.getElementById('endMessage').textContent = currentScript.replace(/\[間\s*[\d.]+[秒s]?\]/g, '').replace(/\s{2,}/g, ' ').trim();
  } else {
    document.getElementById('endMessage').textContent = 'お疲れ様でした。';
  }
}

function resetSession() {
  stopAudio();
  storyWords = [];
  storyAudioBlobs = [];
  currentPhaseIdx = 0;
  currentTurnIdx = 0;
  roundCount = 0;
  currentScript = '';
  isRecording = false;
  mediaRecorder = null;
  recChunks = [];
  document.getElementById('screenEnd').classList.remove('active');
  document.getElementById('screenFacilitator').classList.remove('active');
  document.getElementById('screenSetup').classList.add('active');
  document.getElementById('nextBtn').textContent = '次へ ›';
  document.getElementById('replayStoryArea').style.display = 'none';
  document.getElementById('replayAllBtn').style.display = 'inline-block';
  document.getElementById('replayAllBtn').disabled = false;
  document.getElementById('replayAllBtn').textContent = '▶ 声をつなげて再生';
  document.getElementById('endMessage').innerHTML = '<div class="ldots"><div class="ldot"></div><div class="ldot"></div><div class="ldot"></div></div>';
}

// ── Utils ─────────────────────────────────────────────────────
function esc(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}
